<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMY BOMB LAB</title>

<style>
body {
  background: #171323;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px 12px;
}

h1 { color: #c7a5ff; }

.panel {
  background: #292139;
  padding: 18px;
  margin: 18px auto;
  border-radius: 16px;
  max-width: 600px;
}

button {
  background: #a77bdf;
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 12px 16px;
  margin: 5px;
  cursor: pointer;
}

input, select {
  margin: 8px;
}

#status {
  background: #292139;
  padding: 12px;
  border-radius: 12px;
  overflow-wrap: anywhere;
}

#light {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: #ffffff;
  margin: 20px auto;
  box-shadow: 0 0 35px #ffffff;
  transition: background 0.1s;
}

.block {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: #382b4d;
  padding: 10px;
  margin: 8px 0;
  border-radius: 10px;
  flex-wrap: wrap;
}

.swatch {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: inline-block;
}

.small {
  font-size: 13px;
  color: #d7c7ef;
}

audio {
  width: 100%;
  margin-top: 12px;
}

input[type="range"] {
  width: 90%;
}
</style>
</head>

<body>

<h1>💜 ARMY BOMB LAB 💜</h1>
<p>MAP OF THE SOUL Special Edition</p>

<button onclick="connectBomb()">🔵 Conectar Army Bomb</button>
<button onclick="disconnectBomb()">Desconectar</button>

<div id="status">Estado: laboratorio preparado 🧪</div>
<pre id="info"></pre>

<div class="panel">
<h2>🎵 Mi canción</h2>

<input type="file" id="audioFile" accept="audio/*">

<audio id="audio" controls></audio>

<p id="songName">Ninguna canción cargada</p>

<p>
  <span id="currentTime">00:00</span>
  /
  <span id="duration">00:00</span>
</p>

<input type="range" id="seek" min="0" max="100" value="0">

<button onclick="startSync()">▶️ Reproducir patrón sincronizado</button>
<button onclick="stopSync()">⏸️ Pausar patrón</button>
</div>

<div class="panel">
<h2>🎨 Editor de patrones</h2>

<label>Color:</label>
<input type="color" id="color" value="#8b5cf6">

<br>

<label>Duración del bloque (ms):</label>
<input type="number" id="durationInput" value="1000" min="100" max="60000">

<br>

<button onclick="addBlock()">➕ Agregar bloque</button>
<button onclick="clearPattern()">🗑️ Borrar patrón</button>

<div id="pattern"></div>

<p id="totalTime">Duración del patrón: 0 segundos</p>

<button onclick="savePattern()">💾 Guardar patrón</button>
<button onclick="loadPattern()">📂 Cargar patrón</button>
</div>

<div class="panel">
<h2>💡 Vista previa</h2>
<div id="light"></div>
<p id="previewStatus">Lista para comenzar</p>
</div>

<script>
const SERVICE_UUID =
"00010203-0405-0607-0809-0a0b0c0d1911";

const CHAR1_UUID =
"00010203-0405-0607-0809-0a0b0c0d2b19";

const CHAR2_UUID =
"00010203-0405-0607-0809-0a0b0c0d2b18";

let device;
let server;

let pattern = [];
let syncing = false;

const audio = document.getElementById("audio");
const light = document.getElementById("light");
const seek = document.getElementById("seek");

document.getElementById("audioFile")
.addEventListener("change", function(event) {

  const file = event.target.files[0];

  if (!file) return;

  audio.src = URL.createObjectURL(file);

  document.getElementById("songName").textContent =
    "🎵 " + file.name;

  document.getElementById("previewStatus").textContent =
    "Canción cargada 💜";
});

audio.addEventListener("loadedmetadata", function() {
  document.getElementById("duration").textContent =
    formatTime(audio.duration);

  seek.max = audio.duration || 100;
});

audio.addEventListener("timeupdate", function() {

  document.getElementById("currentTime").textContent =
    formatTime(audio.currentTime);

  if (audio.duration) {
    seek.value = audio.currentTime;
  }

  if (syncing) {
    updateLightFromSong();
  }
});

seek.addEventListener("input", function() {
  if (audio.duration) {
    audio.currentTime = Number(seek.value);
    updateLightFromSong();
  }
});

function formatTime(seconds) {

  if (!Number.isFinite(seconds)) return "00:00";

  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);

  return String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0");
}

function addBlock() {

  const color = document.getElementById("color").value;

  const duration = Number(
    document.getElementById("durationInput").value
  );

  if (!duration || duration < 100) {
    alert("La duración mínima es 100 ms");
    return;
  }

  pattern.push({
    color: color,
    duration: duration
  });

  renderPattern();
}

function removeBlock(index) {
  pattern.splice(index, 1);
  renderPattern();
}

function clearPattern() {
  pattern = [];
  renderPattern();
  light.style.background = "#ffffff";
  light.style.boxShadow = "0 0 35px #ffffff";
}

function renderPattern() {

  const container = document.getElementById("pattern");

  container.innerHTML = "";

  pattern.forEach((block, index) => {

    const div = document.createElement("div");
    div.className = "block";

    const swatch = document.createElement("span");
    swatch.className = "swatch";
    swatch.style.background = block.color;

    const description = document.createElement("span");
    description.textContent =
      "Bloque " + (index + 1) +
      " · " + (block.duration / 1000) + " s";

    const remove = document.createElement("button");
    remove.textContent = "❌";
    remove.onclick = () => removeBlock(index);

    div.appendChild(swatch);
    div.appendChild(description);
    div.appendChild(remove);

    container.appendChild(div);
  });

  const total = pattern.reduce(
    (sum, block) => sum + block.duration,
    0
  );

  document.getElementById("totalTime").textContent =
    "Duración del patrón: " +
    (total / 1000).toFixed(2) +
    " segundos";
}

function updateLightFromSong() {

  if (pattern.length === 0) {
    light.style.background = "#ffffff";
    return;
  }

  const currentMs = audio.currentTime * 1000;

  let elapsed = 0;

  for (const block of pattern) {

    if (currentMs >= elapsed &&
        currentMs < elapsed + block.duration) {

      light.style.background = block.color;
      light.style.boxShadow = "0 0 35px " + block.color;

      document.getElementById("previewStatus").textContent =
        "Bloque activo: " + block.color;

      return;
    }

    elapsed += block.duration;
  }

  light.style.background = "#ffffff";
  light.style.boxShadow = "0 0 15px #ffffff";

  document.getElementById("previewStatus").textContent =
    "La canción continúa después del patrón";
}

async function startSync() {

  if (!audio.src) {
    alert("Primero carga una canción 🎵");
    return;
  }

  if (pattern.length === 0) {
    alert("Primero agrega bloques de colores 💜");
    return;
  }

  syncing = true;

  updateLightFromSong();

  try {
    await audio.play();
    document.getElementById("previewStatus").textContent =
      "Reproduciendo canción y patrón 🎶";
  } catch (error) {
    document.getElementById("previewStatus").textContent =
      "No se pudo reproducir el audio";
  }
}

function stopSync() {

  syncing = false;
  audio.pause();

  document.getElementById("previewStatus").textContent =
    "Pausado";
}

audio.addEventListener("ended", function() {

  syncing = false;

  light.style.background = "#ffffff";
  light.style.boxShadow = "0 0 20px #ffffff";

  document.getElementById("previewStatus").textContent =
    "Canción terminada 🎵";
});

function savePattern() {

  localStorage.setItem(
    "armyBombPattern",
    JSON.stringify(pattern)
  );

  alert("¡Patrón guardado! 💜");
}

function loadPattern() {

  const saved = localStorage.getItem("armyBombPattern");

  if (!saved) {
    alert("No hay ningún patrón guardado");
    return;
  }

  pattern = JSON.parse(saved);
  renderPattern();

  alert("¡Patrón cargado! 💜");
}

function showStatus(message) {
  document.getElementById("status").textContent =
    "Estado: " + message;
}

function bytesToHex(value) {
  return Array.from(new Uint8Array(value))
    .map(b => b.toString(16).padStart(2, "0"))
    .join(" ");
}

async function connectBomb() {

  document.getElementById("info").textContent = "";

  if (!navigator.bluetooth) {
    showStatus("Bluetooth no está disponible 😢");
    return;
  }

  try {

    showStatus("Buscando Army Bomb... 🔍");

    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [SERVICE_UUID]
    });

    showStatus("Conectando...");

    server = await device.gatt.connect();

    const service = await server.getPrimaryService(SERVICE_UUID);

    const char1 = await service.getCharacteristic(CHAR1_UUID);
    const char2 = await service.getCharacteristic(CHAR2_UUID);

    const value1 = await char1.readValue();
    const value2 = await char2.readValue();

    await char2.startNotifications();

    char2.addEventListener(
      "characteristicvaluechanged",
      (event) => {

        const value = event.target.value;

        document.getElementById("info").textContent +=
          "\nNotificación 2b18: " +
          bytesToHex(value.buffer);
      }
    );

    document.getElementById("info").textContent =
      "Dispositivo: " + device.name + "\n\n" +
      "Característica 2b19: " +
      bytesToHex(value1.buffer) + "\n" +
      "Característica 2b18: " +
      bytesToHex(value2.buffer);

    showStatus("¡Conectada! 💜");

  } catch (error) {
    showStatus("Error: " + error.message);
  }
}

function disconnectBomb() {

  if (device && device.gatt.connected) {
    device.gatt.disconnect();
  }

  showStatus("Desconectada");
  document.getElementById("info").textContent = "";
}
</script>

</body>
</html>
